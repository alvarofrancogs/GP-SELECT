# Temporary public address for testing GP SELECT from a phone (or sharing it for a few hours).
# Start:  docker compose -f docker-compose.dev.yml -f docker-compose.tunnel.yml up
# Then look in the output for  https://<random-words>.trycloudflare.com  (or: docker compose -f docker-compose.dev.yml -f docker-compose.tunnel.yml logs tunnel)
# The address changes every time it starts and stops working when you stop it (Ctrl+C). No Cloudflare account is needed.
# Admin: <address>/admin with admin@gpselect.local and the temporary password you were given (docs/BACKEND-SETUP.md, "Probar desde el móvil").
# Anyone who has the address can open the site and its Admin login page, so share it only with people you trust.
name: gpselect-dev

services:
  # Cloudflare's "quick tunnel": reaches the web container from outside; the address is read back from its metrics.
  # It starts alongside the rest: until the web answers it shows an error, and the API retries until the address exists.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:5173

  api:
    environment:
      TUNNEL_METRICS: http://tunnel:2000
      # Not the well-known local password: this address is public. Replace the hash with your own (docs/BACKEND-SETUP.md, "Generar Admin__PasswordHash").
      Admin__PasswordHash: AQAAAAIAAYagAAAAENcjdG7gf/LKK1L3CdrineWBrhbv44x6Ce0KSV73PMvd9+ss9l81EEVH/ys8ORF+gg==

  # The built site, as a phone would get it in production (the dev server sends hundreds of small files, slow over a tunnel).
  web:
    environment:
      VITE_ENQUIRIES_ENABLED: "true"
    command: sh -c "npm ci --no-audit --no-fund && npm run build && exec npx vite preview --host 0.0.0.0 --port 5173 --strictPort"
