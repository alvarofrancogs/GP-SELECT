# GP SELECT in production: one server with Docker. Guide: deploy/README.md.
# Start or update: docker compose up -d --build   (from this folder, with .env filled in)
name: gpselect

services:
  # HTTPS (Let's Encrypt), the built web, and the proxies to the API and to MinIO.
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_SITE_URL: https://${DOMAIN:?}
        VITE_ENQUIRIES_ENABLED: ${ENQUIRIES_ENABLED:-false}
    environment:
      DOMAIN: ${DOMAIN}
      # Upload site for self-hosted storage; without one, an address that never matches.
      S3_SITE: ${S3_DOMAIN:-http://storage.disabled.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CADDY_EXTRA_GLOBAL: ${CADDY_EXTRA_GLOBAL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        # Fixed address: the API trusts X-Forwarded-For only from this proxy (Security__TrustedProxies).
        ipv4_address: 172.30.0.10
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=gpselect;Username=gpselect;Password=${DB_PASSWORD:?};GSS Encryption Mode=Disable
      Security__AllowedOrigin: https://${DOMAIN}
      Security__TrustedProxies: 172.30.0.10
      Admin__Email: ${ADMIN_EMAIL:?}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?}
      DataProtection__KeysPath: /data/keys
      Storage__Provider: S3
      Storage__Endpoint: ${S3_ENDPOINT:?}
      Storage__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:-}
      Storage__AccessKey: ${S3_ACCESS_KEY:?}
      Storage__SecretKey: ${S3_SECRET_KEY:?}
      Storage__Bucket: ${S3_BUCKET:-gpselect}
      Seo__TemplateUrl: http://web:8080/spa.html
      Seo__SiteUrl: https://${DOMAIN}
      Enquiries__Enabled: ${ENQUIRIES_ENABLED:-false}
      Enquiries__NotificationEmail: ${ENQUIRIES_NOTIFICATION_EMAIL:-}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - api-keys:/data/keys
    networks: [internal]
    # Processing a very large photo can take ~0.7 GB (docs/CURRENT-STATE.md, backend debt).
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpselect
      POSTGRES_USER: gpselect
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpselect -d gpselect"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Self-hosted S3 storage (profile self-hosted-storage): SeaweedFS with one key for the API, limited to its bucket.
  # With an external provider (Cloudflare R2, Backblaze B2…) leave the profile off and set S3_ENDPOINT in .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.08
    profiles: [self-hosted-storage]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-gpselect}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"gpselect-api","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],
          "actions":["Read:$$S3_BUCKET","Write:$$S3_BUCKET","List:$$S3_BUCKET"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - storage-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the bucket once (safe to repeat) and exits.
  storage-setup:
    image: chrislusf/seaweedfs:4.08
    profiles: [self-hosted-storage]
    environment:
      S3_BUCKET: ${S3_BUCKET:-gpselect}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        shell() { echo "$$1" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1; }
        for attempt in $$(seq 60); do
          shell s3.bucket.list | grep -qw "$$S3_BUCKET" && { echo "bucket $$S3_BUCKET ready"; exit 0; }
          shell "s3.bucket.create -name $$S3_BUCKET" | grep -i error || true
          sleep 2
        done
        echo "bucket $$S3_BUCKET could not be created" >&2
        exit 1
    networks: [internal]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # Daily database dump to ./backups, keeping BACKUP_KEEP_DAYS days. Copy them off the server too (README).
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: gpselect
      PGUSER: gpselect
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
  api-keys:
  db-data:
  storage-data:
